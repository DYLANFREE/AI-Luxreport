<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>探寻之旅｜AI 产业与投资研究</title>
  <style>
    :root{color-scheme:light;--ink:#171a16;--muted:#60675e;--paper:#f6f3ec;--paper2:#ece8de;--green:#244f38;--gold:#a76627;--rust:#7a4a1f}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;color:var(--ink);background:radial-gradient(circle at 25% 15%,rgba(167,102,39,.14),transparent 34%),linear-gradient(135deg,var(--paper),var(--paper2));}
    main{min-height:100vh;display:flex;flex-direction:column;justify-content:center;width:min(980px,calc(100% - 40px));margin:0 auto;padding:72px 0 56px}
    .eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:800}
    h1{margin:14px 0 10px;font-size:clamp(34px,5vw,64px);line-height:1.05;font-weight:900}
    .lead{max-width:720px;margin:0 0 34px;color:var(--muted);font-size:18px;line-height:1.8}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
    .choice-card{min-height:280px;display:flex;flex-direction:column;justify-content:flex-end;padding:28px;border:1px solid rgba(23,26,22,.14);border-radius:8px;text-decoration:none;color:inherit;background:rgba(255,255,255,.58);box-shadow:0 24px 70px rgba(30,35,26,.10);transition:transform .18s ease,box-shadow .18s ease}
    .choice-card:hover{transform:translateY(-3px);box-shadow:0 30px 90px rgba(30,35,26,.16)}
    .choice-card.journey{background:linear-gradient(145deg,rgba(255,255,255,.76),rgba(244,234,214,.86))}
    .choice-card.nine{background:linear-gradient(145deg,rgba(255,255,255,.76),rgba(226,237,231,.78))}
    .kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:850;color:var(--gold)}
    h2{margin:10px 0 12px;font-size:clamp(26px,3vw,38px);line-height:1.15}
    p{margin:0;color:var(--muted);font-size:16px;line-height:1.75}
    .enter{margin-top:24px;font-weight:850;color:var(--rust)}
    .nine .enter{color:var(--green)}
  </style>
  <link rel="stylesheet" href="assets/research-series.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body class="research-series-page">
<header class="research-series-bar">
  <a class="research-series-link" href="index.html" aria-label="返回 AI 产业与投资研究首页">
    <span class="research-series-mark" aria-hidden="true"></span>
    <span class="research-series-name">AI 产业与投资研究</span>
    <span class="research-series-home">研究首页 <span aria-hidden="true">→</span></span>
  </a>
</header>

  <main>
    <div class="eyebrow">FDE Search</div>
    <h1>探寻之旅</h1>
    <p class="lead">先走这段共同的研究路，再打开方向优先选出的九家。</p>
    <section class="grid" aria-label="探寻之旅入口">
      <a class="choice-card journey" href="fde-journey.html">
        <span class="kicker">The Journey</span>
        <h2>探寻之旅</h2>
        <p>从怎么找到下一个海力士出发，把筛选路上的问题和判断摊开。</p>
        <span class="enter">进入这一页 →</span>
      </a>
      <a class="choice-card nine" href="fde-direction-nine.html">
        <span class="kicker">Nine Names</span>
        <h2>方向优先 9 家</h2>
        <p>用同一把尺子看九家：位置、需求、收入，以及钱能不能留下。</p>
        <span class="enter">进入这一页 →</span>
      </a>
    </section>
  </main>
</body>
</html>
